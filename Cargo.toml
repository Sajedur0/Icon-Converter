[package]
name = "ico_converter"
version = "0.1.0"
edition = "2021"
description = "Minimal, lightweight desktop app for converting images into multi-resolution Windows .ico files"
license = "Apache-2.0"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow", "x11", "wayland"] }
egui = { version = "0.32", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico"] }
rfd = "0.14"
anyhow = { version = "1.0", default-features = false, features = ["std"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
