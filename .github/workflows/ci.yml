name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-x11-0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets
