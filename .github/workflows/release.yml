name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Put executable in release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/ico_converter.exe release/ico_converter.exe

      - name: Publish executable with generated changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Icon Converter ${{ github.ref_name }}
          files: release/ico_converter.exe
          generate_release_notes: true
